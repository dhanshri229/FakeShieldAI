{% extends 'base.html' %}
{% block title %}QR Code Scanner — FakeShield AI{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="bg-cyber-card border border-cyber-border rounded-xl p-8 shadow-xl">
        <div class="flex items-center space-x-3 mb-6">
            <div class="w-12 h-12 rounded-lg bg-purple-950 text-purple-400 flex items-center justify-center text-xl">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-white">QR Code Security Inspector</h1>
                <p class="text-gray-400 text-sm">Decodes QR payload and inspects target URL or payment strings for Quishing threats</p>
            </div>
        </div>

        <form action="{{ url_for('scan_qr_route') }}" method="POST" enctype="multipart/form-data" class="space-y-6">
            <div class="border-2 border-dashed border-cyber-border hover:border-purple-500 rounded-xl p-8 text-center bg-cyber-dark cursor-pointer">
                <i class="fa-solid fa-qrcode text-4xl text-purple-400 mb-3 block"></i>
                <label for="qr_file" class="text-sm text-gray-300 font-semibold cursor-pointer">Click to upload QR Code image</label>
                <input type="file" id="qr_file" name="qr_file" accept="image/*" required class="hidden" onchange="document.getElementById('fileName').innerText = this.files[0].name">
                <p id="fileName" class="text-xs text-purple-400 mt-2">PNG, JPG, JPEG files supported</p>
            </div>

            <button type="submit" class="w-full py-3.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-lg transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Decode & Scan QR Code</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
