{% extends 'base.html' %}
{% block title %}Email Scanner — FakeShield AI{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="bg-cyber-card border border-cyber-border rounded-xl p-8 shadow-xl">
        <div class="flex items-center space-x-3 mb-6">
            <div class="w-12 h-12 rounded-lg bg-blue-950 text-blue-400 flex items-center justify-center text-xl">
                <i class="fa-solid fa-envelope"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-white">Email Scam & Phishing Detector</h1>
                <p class="text-gray-400 text-sm">TF-IDF Machine Learning NLP + Urgency & Financial Keyword Analysis</p>
            </div>
        </div>

        <form action="{{ url_for('scan_email_route') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Sender Email Address (Optional)</label>
                <input type="email" name="sender" placeholder="support@secure-bank-verify.xyz"
                    class="w-full px-4 py-2.5 bg-cyber-dark border border-cyber-border rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Email Subject Line</label>
                <input type="text" name="subject" placeholder="URGENT: Your SBI Account is Suspended!"
                    class="w-full px-4 py-2.5 bg-cyber-dark border border-cyber-border rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Email Content / Body Text</label>
                <textarea name="body" rows="6" placeholder="Paste the complete email text content here..." required
                    class="w-full px-4 py-2.5 bg-cyber-dark border border-cyber-border rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-blue-500"></textarea>
            </div>

            <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-shield-cat"></i>
                <span>Scan Email Content</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
