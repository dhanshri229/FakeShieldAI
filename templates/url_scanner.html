{% extends 'base.html' %}
{% block title %}URL Scanner — FakeShield AI{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="bg-cyber-card border border-cyber-border rounded-xl p-8 shadow-xl">
        <div class="flex items-center space-x-3 mb-6">
            <div class="w-12 h-12 rounded-lg bg-cyan-950 text-cyan-400 flex items-center justify-center text-xl">
                <i class="fa-solid fa-globe"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-white">Advanced URL & Website Scanner</h1>
                <p class="text-gray-400 text-sm">14-Feature ML Extraction + VirusTotal Threat Intelligence + Domain Age Lookup</p>
            </div>
        </div>

        <form action="{{ url_for('scan_url_route') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Target Website URL</label>
                <div class="relative">
                    <i class="fa-solid fa-link absolute left-4 top-4 text-gray-500"></i>
                    <input type="url" name="url" placeholder="https://example-phishing-login.xyz/verify" required
                        class="w-full pl-11 pr-4 py-3 bg-cyber-dark border border-cyber-border rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg glow-cyan transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Analyze URL Safety</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
