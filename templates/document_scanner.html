{% extends 'base.html' %}
{% block title %}Document Scanner — FakeShield AI{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="bg-cyber-card border border-cyber-border rounded-xl p-8 shadow-xl">
        <div class="flex items-center space-x-3 mb-6">
            <div class="w-12 h-12 rounded-lg bg-amber-950 text-amber-400 flex items-center justify-center text-xl">
                <i class="fa-solid fa-file-pdf"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-white">Document Threat Scanner</h1>
                <p class="text-gray-400 text-sm">Parses PDF, DOCX, and TXT files to identify fake loan letters, phishing URLs, and scam instructions</p>
            </div>
        </div>

        <form action="{{ url_for('scan_document_route') }}" method="POST" enctype="multipart/form-data" class="space-y-6">
            <div class="border-2 border-dashed border-cyber-border hover:border-amber-500 rounded-xl p-8 text-center bg-cyber-dark cursor-pointer">
                <i class="fa-solid fa-file-arrow-up text-4xl text-amber-400 mb-3 block"></i>
                <label for="doc_file" class="text-sm text-gray-300 font-semibold cursor-pointer">Click to upload PDF, TXT or DOC file</label>
                <input type="file" id="doc_file" name="doc_file" accept=".pdf,.txt,.doc,.docx" required class="hidden" onchange="document.getElementById('fileName').innerText = this.files[0].name">
                <p id="fileName" class="text-xs text-amber-400 mt-2">PDF, TXT, DOCX supported</p>
            </div>

            <button type="submit" class="w-full py-3.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-magnifying-glass font-bold"></i>
                <span>Scan Document Contents</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
