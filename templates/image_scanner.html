{% extends 'base.html' %}
{% block title %}Image OCR Scanner — FakeShield AI{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="bg-cyber-card border border-cyber-border rounded-xl p-8 shadow-xl">
        <div class="flex items-center space-x-3 mb-6">
            <div class="w-12 h-12 rounded-lg bg-pink-950 text-pink-400 flex items-center justify-center text-xl">
                <i class="fa-solid fa-image"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-white">Image OCR Fraud Detector</h1>
                <p class="text-gray-400 text-sm">Extracts text from screenshots (Fake Payment Receipts, Bank Notices, Job Offers) via OCR</p>
            </div>
        </div>

        <form action="{{ url_for('scan_image_route') }}" method="POST" enctype="multipart/form-data" class="space-y-6">
            <div class="border-2 border-dashed border-cyber-border hover:border-pink-500 rounded-xl p-8 text-center bg-cyber-dark cursor-pointer">
                <i class="fa-solid fa-cloud-arrow-up text-4xl text-pink-400 mb-3 block"></i>
                <label for="image_file" class="text-sm text-gray-300 font-semibold cursor-pointer">Click to upload screenshot image</label>
                <input type="file" id="image_file" name="image_file" accept="image/*" required class="hidden" onchange="document.getElementById('fileName').innerText = this.files[0].name">
                <p id="fileName" class="text-xs text-pink-400 mt-2">PNG, JPG, JPEG files supported</p>
            </div>

            <button type="submit" class="w-full py-3.5 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-lg transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-eye"></i>
                <span>Extract OCR Text & Scan</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
