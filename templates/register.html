{% extends 'base.html' %}

{% block title %}Register Account — FakeShield AI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto space-y-6">
    <div class="bg-cyber-card border border-cyber-border rounded-2xl p-8 shadow-2xl space-y-6">
        <div class="text-center">
            <i class="fa-solid fa-user-plus text-4xl text-cyan-400 mb-2 inline-block"></i>
            <h1 class="text-2xl font-bold text-white">Create FakeShield Account</h1>
            <p class="text-gray-400 text-xs mt-1">Join the threat defense platform</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Username</label>
                <input type="text" name="username" placeholder="Choose a username" required
                    class="w-full px-4 py-2.5 bg-cyber-dark border border-cyber-border rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Email Address</label>
                <input type="email" name="email" placeholder="name@example.com" required
                    class="w-full px-4 py-2.5 bg-cyber-dark border border-cyber-border rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <input type="password" name="password" placeholder="••••••••" required
                    class="w-full px-4 py-2.5 bg-cyber-dark border border-cyber-border rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 text-sm">
            </div>

            <button type="submit" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg glow-cyan transition text-sm">
                Create Account
            </button>
        </form>

        <p class="text-center text-xs text-gray-400">
            Already have an account? <a href="{{ url_for('login') }}" class="text-cyan-400 hover:underline font-semibold">Sign In</a>
        </p>
    </div>
</div>
{% endblock %}
